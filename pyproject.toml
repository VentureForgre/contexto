[project]
name = "contexto"
version = "0.1.0"
description = "Durable, recoverable context for very long-running AI sessions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
contexto = "contexto.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
