[project]
# The distribution name on PyPI, where `contexto` is an unrelated project. The command and the import
# name stay `contexto` (see [tool.uv.build-backend] below).
name = "contexto-proxy"
# Placeholder, so a build from a checkout cannot be taken for a release. The release workflow
# stamps the real version into the runner's copy only (.github/scripts/release-build.sh).
version = "0.0.0+checkout"
description = "Local proxy that keeps Claude Code and Codex sessions under a token bound so they never compact; old turns stay on disk and the model reads them back over MCP."
# A description written for PyPI: README.md's relative links are dead there.
readme = "docs/pypi-description.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "VentureForgre" }]
maintainers = [{ name = "VentureForgre" }]
# 3.12 is the floor. On 3.11 the json module's C recursion counts against the Python recursion limit,
# so a document inside the 512-level nesting limit raises RecursionError in a handler thread; 3.12
# changed that accounting.
requires-python = ">=3.12"
dependencies = []
keywords = [
    "claude",
    "claude-code",
    "codex",
    "compaction",
    "context-window",
    "llm",
    "mcp",
    "proxy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
]

# Labels PyPI shows an icon for.
[project.urls]
Homepage = "https://github.com/VentureForgre/contexto"
Repository = "https://github.com/VentureForgre/contexto"
Documentation = "https://github.com/VentureForgre/contexto/blob/main/README.md"
Changelog = "https://github.com/VentureForgre/contexto/blob/main/CHANGELOG.md"
"Release Notes" = "https://github.com/VentureForgre/contexto/releases"
Issues = "https://github.com/VentureForgre/contexto/issues"
Security = "https://github.com/VentureForgre/contexto/security/policy"

[project.scripts]
contexto = "contexto.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The module is src/contexto, not the src/contexto_proxy the distribution name would imply.
module-name = "contexto"

[tool.pytest.ini_options]
# Package tests and the M0 spike tests that research documents cite.
testpaths = ["tests", "spikes"]

[tool.ruff]
target-version = "py312"
# The code has no enforced width; 120 is the longest common one it fits. `ruff format` is not
# enforced: it would rewrite most files, which is churn rather than a fix.
line-length = 120
# Tests import each other (`from test_rewrite import ...`); sort those with the package, as written.
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    # zip() without strict=: the zipped sequences are equal by construction, and strict=True
    # would turn a silent truncation into an exception, which is a behavior change.
    "B905",
]

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclasses: safe as argument defaults.
extend-immutable-calls = [
    "contexto.rewrite.Config",
    "acceptance.budget.Params",
    "cost_model.CvmPolicy",
    "fidelity.harder.Mix",
]

[tool.ruff.lint.per-file-ignores]
# Research spikes are frozen measurement code that docs/research cites; long lines are left as written.
"spikes/**" = ["E501"]
