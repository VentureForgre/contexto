<text x="22" y="62" textLength="630"><tspan class="n"># Synthetic session: a stub CLI and a fake upstream on 127.0.0.1. No model.</tspan></text>
<text class="t0" x="22" y="81" textLength="705.6"><tspan class="u">[fake upstream]</tspan><tspan class="d"> listening on 127.0.0.1:8399, counting 1 token per 3.5 bytes received</tspan></text>
<text class="t1" x="22" y="100" textLength="596.4"><tspan class="p">$</tspan><tspan> contexto run --bound 60000 --headroom-floor 5000 --no-version-check \</tspan></text>
<text class="t1" x="55.6" y="119" textLength="327.6"><tspan>--upstream http://127.0.0.1:8399 claude</tspan></text>
<text class="t2" x="22" y="138" textLength="672"><tspan>contexto: session 3644192b2307497a94cc28acff1b2ba2 (bound 60,000, upstream flag)</tspan></text>
