<text class="t17" x="22" y="784" textLength="646.8"><tspan class="s">[stub claude]</tspan><tspan class="d"> scripted reply: "The search result names it: </tspan><tspan class="h">amber-kestrel-17</tspan><tspan class="d">."</tspan></text>
