name: CI

on:
  pull_request:
    branches: [main]
  # Test main itself after every merge. release.yml also calls this workflow on pushes to main, but
  # only when RELEASES_ENABLED is "true"; with releases on, a main push runs CI twice (about a
  # minute). No concurrency group: one shared with Release's call would cancel its pending run.
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.12"
          # A job that never runs uv (no Ruff config, no tests) leaves no cache to save.
          ignore-nothing-to-cache: true
      - name: Lint with Ruff when the repository configures it
        run: |
          if [ -f ruff.toml ] || [ -f .ruff.toml ] || { [ -f pyproject.toml ] && grep -q '^\[tool\.ruff' pyproject.toml; }; then
            uvx ruff check .
            uvx ruff format --check .
          else
            echo "No Ruff configuration in this tree; skipping lint."
          fi

  test:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.12"
          # A job that never runs uv (no Ruff config, no tests) leaves no cache to save.
          ignore-nothing-to-cache: true
      - name: Run pytest when the tree has tests
        run: |
          if git ls-files -- '*test_*.py' '*_test.py' | grep -q .; then
            uv run --with pytest pytest
          else
            echo "No test files in this tree; skipping pytest."
          fi
      - name: Check the package builds when the tree has one
        run: |
          if [ -f pyproject.toml ]; then
            uv build --out-dir "$RUNNER_TEMP/dist"
          else
            echo "No pyproject.toml in this tree; skipping the build check."
          fi

  ci:
    name: ci
    if: always()
    needs: [lint, test]
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Require every CI job to succeed
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
        run: |
          test "$LINT" = success
          test "$TEST" = success
