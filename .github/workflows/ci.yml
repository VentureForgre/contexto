name: CI

on:
  pull_request:
    branches: [main]
  # Test main itself after every merge. Release (release.yml) also calls this workflow, before it
  # cuts a release.
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run. Every other run (a push to
# main, Release's call) is a group of its own, so nothing on main is cancelled or held back.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          # Pinned like Ruff and pytest. uv is also the build backend, and its version is in the wheel.
          version: "0.13.7"
          python-version: "3.12"
          # uvx keeps its tools outside the uv cache, so this job may leave nothing to save.
          ignore-nothing-to-cache: true
      # Ruff is pinned so a new release cannot fail CI on code that did not change. The rules are in
      # pyproject.toml. `ruff format --check` is not run: it would rewrite most files.
      - name: Lint with Ruff
        run: uvx ruff@0.17.2 check .

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14", "3.15"]
        include:
          # The oldest supported and the newest stable Python on macOS.
          - os: macos-latest
            python: "3.12"
          - os: macos-latest
            python: "3.15"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          # Pinned like Ruff and pytest. uv is also the build backend, and its version is in the wheel.
          version: "0.13.7"
          # uv downloads this CPython when the runner lacks it.
          python-version: ${{ matrix.python }}
      # pytest is pinned for the same reason as Ruff.
      - name: Run pytest
        if: runner.os != 'Windows'
        run: uv run --with pytest==9.1.1 pytest
      # On Windows, skip test modules whose harnesses depend on POSIX-only primitives (shebang fake
      # CLIs, /bin/sh, os.mkfifo, POSIX signals/chmod, install.sh) and run the full portable suite.
      - name: Run pytest (Windows portable suite)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          uv run --with pytest==9.1.1 pytest -o faulthandler_timeout=120 --tb=short tests \
            --ignore=tests/test_bench_live.py \
            --ignore=tests/test_bench_live_kill.py \
            --ignore=tests/test_bench_live_real.py \
            --ignore=tests/test_bench_live_stops.py \
            --ignore=tests/test_bench_live_turns.py \
            --ignore=tests/test_bench_live_units.py \
            --ignore=tests/test_bench_replay_run.py \
            --ignore=tests/test_bench_report.py \
            --ignore=tests/test_cli_d57.py \
            --ignore=tests/test_cli_d64.py \
            --ignore=tests/test_cliproxyapi.py \
            --ignore=tests/test_cliversions.py \
            --ignore=tests/test_codex.py \
            --ignore=tests/test_codex_stub_refresh.py \
            --ignore=tests/test_doctor.py \
            --ignore=tests/test_hint_headers_launcher.py \
            --ignore=tests/test_install_script.py \
            --ignore=tests/test_launcher.py \
            --ignore=tests/test_mcp_serve.py \
            --ignore=tests/test_page_cache.py \
            --ignore=tests/test_project.py \
            --ignore=tests/test_project_command.py \
            --ignore=tests/test_project_damage.py \
            --ignore=tests/test_project_in_view.py \
            --ignore=tests/test_project_launch.py \
            --ignore=tests/test_project_measure.py \
            --ignore=tests/test_project_search.py \
            --ignore=tests/test_project_start.py \
            --ignore=tests/test_provider_guard.py \
            --ignore=tests/test_release_workflow.py \
            --ignore=tests/test_serve.py \
            --ignore=tests/test_serve_end_to_end.py \
            --ignore=tests/test_serve_real_client.py \
            --ignore=tests/test_serve_recipes.py \
            --ignore=tests/test_sessions_prune.py \
            --ignore=tests/test_settings_trust.py \
            --ignore=tests/test_stats.py \
            --ignore=tests/test_stats_launch.py \
            --ignore=tests/test_statusline.py \
            --ignore=tests/test_store_mcp_robustness.py \
            --ignore=tests/test_toolcheck.py \
            --ignore=tests/test_upstream.py \
            --ignore=tests/test_upstream_affinity.py
      - name: Check that the package builds
        shell: bash
        run: uv build --out-dir "$RUNNER_TEMP/dist"

  # Install what was built, on every leg the tests run on: the matrix is a copy of test's, and
  # tests/test_packaging.py fails if the two differ. The test job runs the checkout's code from the
  # project environment; this one runs the wheel, and the sdist, from environments that hold nothing
  # else. The same script runs locally.
  install:
    name: install (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14", "3.15"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: macos-latest
            python: "3.15"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          # Pinned like Ruff and pytest. uv is also the build backend, and its version is in the wheel.
          version: "0.13.7"
          # uv downloads this CPython when the runner lacks it.
          python-version: ${{ matrix.python }}
          # The script installs without the uv cache, so this job may leave nothing to save.
          ignore-nothing-to-cache: true
      - name: Install the built wheel and sdist into empty environments and run them
        shell: bash
        env:
          MATRIX_PYTHON: ${{ matrix.python }}
        run: bash .github/scripts/install-check.sh "$MATRIX_PYTHON"

  # What PyPI would get, checked once: the artifacts do not depend on the Python that builds them.
  # twine and readme-renderer are pinned in the script. Nothing is uploaded.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          # Pinned like Ruff and pytest. uv is also the build backend, and its version is in the wheel.
          version: "0.13.7"
          python-version: "3.12"
          ignore-nothing-to-cache: true
      - name: Check the sdist, the wheel, their metadata and the rendered long description
        run: bash .github/scripts/package-check.sh

  # The one required status check. Branch rules name this job, not the matrix legs.
  ci:
    name: ci
    if: always()
    needs: [lint, test, install, package]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to succeed
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          INSTALL: ${{ needs.install.result }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          test "$LINT" = success
          test "$TEST" = success
          test "$INSTALL" = success
          test "$PACKAGE" = success
