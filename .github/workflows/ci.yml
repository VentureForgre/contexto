name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diag:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.12"
      - name: Time hostname lookups and server binds
        run: |
          uv run python - <<'EOF'
          import socket, time
          from http.server import ThreadingHTTPServer, BaseHTTPRequestHandler
          def timed(label, fn):
              t = time.monotonic()
              try:
                  r = fn()
              except Exception as exc:
                  r = repr(exc)
              print(f"{label}: {time.monotonic() - t:.2f}s -> {r!r}", flush=True)
          timed("gethostname", socket.gethostname)
          timed("getfqdn(127.0.0.1)", lambda: socket.getfqdn("127.0.0.1"))
          timed("gethostbyaddr(127.0.0.1)", lambda: socket.gethostbyaddr("127.0.0.1"))
          timed("getfqdn()", socket.getfqdn)
          timed("ThreadingHTTPServer bind", lambda: ThreadingHTTPServer(("127.0.0.1", 0), BaseHTTPRequestHandler).server_name)
          EOF
      - name: Time a contexto run with a fake claude
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/bin/claude"
          chmod +x "$RUNNER_TEMP/bin/claude"
          export PATH="$RUNNER_TEMP/bin:$PATH" CONTEXTO_HOME="$RUNNER_TEMP/home"
          time uv run python -X importtime -m contexto run --upstream http://127.0.0.1:9 --session d1 claude 2> "$RUNNER_TEMP/imp.log" || true
          sort -t'|' -k2 -n "$RUNNER_TEMP/imp.log" | tail -5
          time uv run python -m contexto run --upstream http://127.0.0.1:9 --session d2 claude || true
