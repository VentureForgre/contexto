name: Release

# A release creates a v{version} tag on the merged commit and a GitHub Release with the
# sdist and wheel attached. It never pushes a commit: main is protected by a ruleset with
# no bypass actors, and semantic-release runs with --no-commit. See RELEASING.md.
#
# Releases are off until the repository variable RELEASES_ENABLED is set to "true"
# (Settings > Secrets and variables > Actions > Variables). Unset or any other value:
# no tag, no release, no asset upload, on push or on manual dispatch.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag whose sdist and wheel should be rebuilt and re-attached (for example v0.2.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  PSR: uvx --from python-semantic-release==10.7.0 semantic-release -c .github/semantic-release.toml

jobs:
  disabled:
    if: vars.RELEASES_ENABLED != 'true'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Report that releases are off
        run: echo "::notice::Releases are disabled. Set the repository variable RELEASES_ENABLED to true to enable them (see RELEASING.md)."

  ci:
    if: github.event_name == 'push' && vars.RELEASES_ENABLED == 'true'
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    if: github.event_name == 'push' && vars.RELEASES_ENABLED == 'true'
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.12"
          # A job that never runs uv (no Ruff config, no tests) leaves no cache to save.
          ignore-nothing-to-cache: true

      - name: Compute the next version from Conventional Commits
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          last=$($PSR version --print-last-released-tag || true)
          next=$($PSR version --print-tag)
          echo "Last released: ${last:-none}. Next: ${next:-none}."
          # With no tags and no feat, fix, or perf commit, semantic-release proposes v0.0.0
          # ("Initial Release"); that is not a release.
          if [ -n "$next" ] && [ "$next" != "$last" ] && [ "$next" != "v0.0.0" ] \
             && ! git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$next" >> "$GITHUB_OUTPUT"
          else
            echo "No releasable commits since ${last:-the start of history}; nothing to release."
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, tag the merged commit, and create the release (no commit)
        if: steps.plan.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $PSR version --no-commit --tag --push --vcs-release --no-changelog

      - name: Check that only a tag was created
        if: steps.plan.outputs.released == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA"
          remote=$(git ls-remote origin "refs/tags/$TAG^{}" "refs/tags/$TAG" | awk 'NR==1 {print $1}')
          test -n "$remote"
          echo "$TAG points at $GITHUB_SHA; HEAD unchanged; no commit was made."

      - name: Attach the sdist and wheel
        if: steps.plan.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          shopt -s nullglob
          files=(dist/*.tar.gz dist/*.whl)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No distributions were built (no pyproject.toml on this commit)."
            exit 0
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

  reattach:
    if: github.event_name == 'workflow_dispatch' && vars.RELEASES_ENABLED == 'true'
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      # Check out main, not the tag: semantic-release cannot match release groups on a detached HEAD.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.12"
          # A job that never runs uv (no Ruff config, no tests) leaves no cache to save.
          ignore-nothing-to-cache: true
      - name: Refuse anything but an existing release tag on main
        run: bash .github/scripts/reattach-verify.sh "$TAG"
      - name: Create the release if the tag exists without one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists."
            exit 0
          fi
          # Prove the notes can be generated before creating anything.
          $PSR --noop changelog --post-to-release-tag "$TAG"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes "Release notes are being generated."
          # Replace the placeholder with the Conventional Commit notes for this tag.
          $PSR changelog --post-to-release-tag "$TAG"
      - name: Rebuild at the tagged version and re-attach
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout --quiet --detach "refs/tags/$TAG"
          # Drop files main's checkout left behind (semantic-release writes CHANGELOG.md), so the
          # sdist holds exactly the tagged tree.
          git clean -ffdx
          NEW_VERSION="${TAG#v}" bash .github/scripts/release-build.sh
          shopt -s nullglob
          files=(dist/*.tar.gz dist/*.whl)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Nothing to attach: $TAG has no pyproject.toml."
            exit 0
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
