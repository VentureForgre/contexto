<text x="24.0" y="497.0" font-size="11" fill="#52514e" text-anchor="start" data-note="start">History length is estimated from the script, not counted by a tokenizer: 1.8 bytes per token for log turns plus 20</text>
<text x="24.0" y="512.0" font-size="11" fill="#52514e" text-anchor="start">tokens per reply, and 3.5 bytes per token for probe turns.</text>
